name: Unit tests

# Runs the unit tests, including the end-to-end /lesson flow through the real
# language-learning-audio CLI (stub audio). Plain pull_request (not _target), so the
# PR's code runs without the repository's secrets or write access.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    # pinned: .python-version is 3.11.2, the Raspberry Pi's Python, and ubuntu-latest moved to 26.04, which has no 3.11.2 build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with the language-learning-audio submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
