name: Seal secrets

# Actions secrets → the bot, without SSH (issue #119). The bot's machine only pulls `main`, and a workflow's secrets exist only inside a run, so the values travel
# through `main` encrypted to a key only the bot's machine holds (libsodium sealed box, like GitHub's own secrets).
#
# One-time setup (the owner): `/bot-public-key` in Discord shows the bot's public key → repository variable BOT_PUBLIC_KEY; repository secrets
# AZURE_SPEECH_KEY and AZURE_SPEECH_REGION; Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
# Run this workflow from the Actions tab (main only) and merge its PR. The ciphertext is safe in the repository: only the bot can open it.
# The plaintext is never echoed, logged or uploaded. Changing which names are sealed needs a reviewed change to ALLOWLIST (src/secrets_box.py).
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install PyNaCl
        run: pip install pynacl

      - name: Seal
        env:
          BOT_PUBLIC_KEY: ${{ vars.BOT_PUBLIC_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python -m src.seal_secrets sealed/secrets.sealed

      - name: Open a pull request with the sealed file only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="seal-secrets-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$branch"
          git add sealed/secrets.sealed
          if git diff --cached --quiet; then
            echo "The sealed file is unchanged."
            exit 0
          fi
          git commit -m "Seal secrets for the bot"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Seal secrets for the bot" --body "Only \`sealed/secrets.sealed\`: encrypted to the bot's public key. The bot opens it on its next start."
